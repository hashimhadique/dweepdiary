name: dweepdiary
description: Official Mobile Application for Dweep Diary News Portal (www.dweepdiary.in)
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking & Data
  http: ^1.2.0
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  shared_preferences: ^2.2.2
  html: ^0.15.4

  # Icons & UI Elements
  cupertino_icons: ^1.0.6
  carousel_slider: ^5.0.0
  shimmer: ^3.0.0
  share_plus: ^10.0.0
  image_picker: ^1.1.2
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1

  # Audio & Text-to-Speech
  flutter_tts: ^4.0.2

  # Push Notifications
  onesignal_flutter: ^5.2.0

  # Monetization (Google Mobile Ads)
  google_mobile_ads: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/app_icon.png
