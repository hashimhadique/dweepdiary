name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Clean Recreate Android Folder via Flutter
        run: |
          rm -rf android
          flutter create . --org in.dweepdiary --project-name dweepdiary --platforms=android

      - name: Configure Android, Kotlin 1.9.24, minSdk 24, and AdMob
        run: |
          python3 -c "
          import re

          # 1. Update android/settings.gradle to Kotlin 1.9.24 (required by modern plugins like OneSignal)
          settings_gradle = 'android/settings.gradle'
          with open(settings_gradle, 'r', encoding='utf-8') as f:
              s_content = f.read()

          # Replace kotlin plugin version with 1.9.24
          s_content = re.sub(
              r'id\s+[\"\\\']org\.jetbrains\.kotlin\.android[\"\\\']\s+version\s+[\"\\\'][^\"\\\']+[\"\\\']',
              'id \"org.jetbrains.kotlin.android\" version \"1.9.24\"',
              s_content
          )
          with open(settings_gradle, 'w', encoding='utf-8') as f:
              f.write(s_content)
          print('settings.gradle updated with Kotlin 1.9.24')

          # 2. Update android/app/build.gradle for minSdk 24 and multiDex
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r', encoding='utf-8') as f:
              a_content = f.read()

          # Set minSdk to 24 (required by flutter_tts)
          a_content = re.sub(r'minSdkVersion\s*=\s*flutter\.minSdkVersion', 'minSdkVersion = 24', a_content)
          a_content = re.sub(r'minSdk\s*=\s*flutter\.minSdkVersion', 'minSdk = 24', a_content)
          a_content = re.sub(r'minSdk\s+\d+', 'minSdk 24', a_content)

          # Ensure multiDexEnabled
          if 'multiDexEnabled' not in a_content:
              a_content = a_content.replace('defaultConfig {', 'defaultConfig {\n        multiDexEnabled true')

          with open(app_gradle, 'w', encoding='utf-8') as f:
              f.write(a_content)
          print('app/build.gradle updated with minSdk 24 and multiDex')

          # 3. Update AndroidManifest.xml for AdMob and Permissions
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              m_content = f.read()

          admob_tag = '<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"ca-app-pub-9969872629451816~3787335139\"/>'
          if 'com.google.android.gms.ads.APPLICATION_ID' not in m_content:
              m_content = m_content.replace('</application>', f'    {admob_tag}\n    </application>')

          perms = '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\"/>\n'
          if 'android.permission.INTERNET' not in m_content:
              m_content = m_content.replace('<application', f'{perms}    <application')

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(m_content)
          print('AndroidManifest updated successfully!')
          "

      - name: Copy App Launcher Icons
        run: |
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: dweepdiary-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
