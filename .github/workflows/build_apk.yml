name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Clean Recreate Android Folder via Flutter
        run: |
          rm -rf android
          flutter create . --org in.dweepdiary --project-name app --platforms=android

      - name: Configure Android for Dweep Diary
        run: |
          python3 scripts/configure_android.py

      - name: Copy Release Keystore & App Launcher Icons
        run: |
          mkdir -p android/app
          cp keystore/upload-keystore.jks android/app/upload-keystore.jks || true
          cp keystore/upload-keystore.jks android/upload-keystore.jks || true
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp assets/images/app_icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Install Android Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Optimized Split APKs & Play Store AAB
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release

      - name: Verify Play Store AAB Package Name & Signature
        run: |
          echo "=== Verifying AAB Signature ==="
          unzip -p build/app/outputs/bundle/release/*.aab META-INF/*.RSA | keytool -printcert
          if unzip -p build/app/outputs/bundle/release/*.aab META-INF/*.RSA | keytool -printcert | grep -i "Android Debug"; then
            echo "ERROR: Bundle was signed with Debug key! Aborting."
            exit 1
          fi
          echo "SUCCESS: Bundle is verified signed with Dweep Diary Production Keystore!"
          echo "=== Verifying Package Name ==="
          unzip -p build/app/outputs/bundle/release/*.aab base/manifest/AndroidManifest.xml | strings | grep "in.dweepdiary.app" || true

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: dweepdiary-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: dweepdiary-playstore-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
